name: com0com probe
on:
  push:
    branches: [windows-loopback-probe]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Platform
      run: |
        [System.Environment]::OSVersion.VersionString
        try { "SecureBoot: $(Confirm-SecureBootUEFI)" } catch { "SecureBoot: $($_.Exception.Message)" }
        bcdedit /enum '{current}' | Select-String -Pattern 'testsigning|nointegritychecks|hypervisor'
        Get-CimInstance Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction SilentlyContinue | Format-List SecurityServicesRunning,VirtualizationBasedSecurityStatus,CodeIntegrityPolicyEnforcementStatus
    - name: Download com0com 2.2.2.0 signed (pinned)
      run: |
        $u = 'https://downloads.sourceforge.net/project/com0com/com0com/2.2.2.0/com0com-2.2.2.0-x64-fre-signed.zip'
        Invoke-WebRequest $u -OutFile c.zip -UserAgent 'curl/8'
        $h = (Get-FileHash c.zip -Algorithm SHA256).Hash
        if ($h -ne '3BC7313E8577774CE78CFF4D1C816FAF96CFA48C485BBCC5527D4569F7D5E373') { throw "hash $h" }
        Expand-Archive c.zip -DestinationPath .
        7z x -oc0c com0com-2.2.2.0-x64-fre-signed\setup.exe | Select-Object -Last 3
        Get-ChildItem -Recurse c0c | Select-Object FullName,Length | Format-Table -AutoSize
    - name: Signatures
      run: |
        Get-ChildItem -Recurse c0c -Include *.sys,*.cat,*.exe | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; "{0}  {1}  {2}  {3}" -f $_.Name,$s.Status,$s.SignerCertificate.Subject,$s.SignerCertificate.NotAfter }
    - name: Trust signer
      run: |
        $cat = Get-ChildItem -Recurse c0c -Filter com0com.cat | Select-Object -First 1
        $cert = (Get-AuthenticodeSignature $cat.FullName).SignerCertificate
        if (-not $cert) { throw 'no signer cert on com0com.cat' }
        foreach ($store in 'TrustedPublisher','Root') {
          $s = New-Object System.Security.Cryptography.X509Certificates.X509Store($store,'LocalMachine'); $s.Open('ReadWrite'); $s.Add($cert); $s.Close()
        }
        "trusted $($cert.Subject)"
    - name: Install a port pair
      run: |
        $dir = (Get-ChildItem -Recurse c0c -Filter setupc.exe | Select-Object -First 1).DirectoryName
        Push-Location $dir
        Get-ChildItem | Select-Object Name | Format-Wide -Column 6
        $p = Start-Process .\setupc.exe -ArgumentList '--silent','install','PortName=COM10','PortName=COM11' -Wait -PassThru -NoNewWindow
        "setupc exit $($p.ExitCode)"
        Pop-Location
        Start-Sleep 5
        Get-ItemProperty HKLM:\HARDWARE\DEVICEMAP\SERIALCOMM -ErrorAction SilentlyContinue | Format-List
        Get-PnpDevice -Class Ports -ErrorAction SilentlyContinue | Format-Table Status,FriendlyName,InstanceId -AutoSize
        Get-PnpDevice | Where-Object FriendlyName -match 'com0com' | Format-Table Status,Problem,FriendlyName -AutoSize
        [System.IO.Ports.SerialPort]::GetPortNames()
    - name: Bytes across the pair
      run: |
        $a = New-Object System.IO.Ports.SerialPort COM10,115200; $b = New-Object System.IO.Ports.SerialPort COM11,115200
        $a.ReadTimeout = 3000; $b.ReadTimeout = 3000
        $a.Open(); $b.Open()
        $a.Write('hello com0com'); Start-Sleep -Milliseconds 300
        "COM11 got: $($b.ReadExisting())"
        $a.Close(); $b.Close()
    - name: Driver install log
      if: always()
      run: |
        $log = "$env:windir\INF\setupapi.dev.log"
        if (Test-Path $log) { Get-Content $log -Tail 80 }
