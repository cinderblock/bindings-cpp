name: Test / Lint
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v3
      with:
        node-version: 20
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
  test:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets codecov-action authenticate with OIDC instead of a stored token
      id-token: write
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        config:
          # arch isn't used and we have no way to use it currently
          - { os: macos-latest, arch: x64 }
          - { os: ubuntu-latest, arch: x64 }
          - { os: windows-2022, arch: x64 }
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install C++ coverage tools
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          choco install opencppcoverage --no-progress -y
          echo "C:\Program Files\OpenCppCoverage" >> "$GITHUB_PATH"
        else
          pipx install gcovr
        fi
    - run: npm ci
    # Debug builds (-O0 / /Od) keep line coverage accurate. --coverage adds gcov instrumentation on
    # Linux and macOS (see binding.gyp). On Windows, OpenCppCoverage reads the debug build's PDB.
    - run: npm run rebuild -- --debug --coverage
    - if: runner.os != 'Windows'
      name: Start a loopback serial port
      # A pty that echoes everything back, like a TX-RX jumper, so the hardware tests in
      # lib/bindings.test.ts run. TEST_PORT_TYPE=pty skips the few a pty can't support (see
      # test/config.json). test/pty-loopback.py explains why it isn't `socat ... exec:cat`.
      run: |
        port="$RUNNER_TEMP/ttyLOOP"
        nohup python3 test/pty-loopback.py "$port" > "$RUNNER_TEMP/pty-loopback.log" 2>&1 &
        for i in $(seq 50); do [ -e "$port" ] && break; sleep 0.1; done
        ls -l "$port"
        echo "TEST_PORT=$port" >> "$GITHUB_ENV"
        echo "TEST_PORT_TYPE=pty" >> "$GITHUB_ENV"
    - if: runner.os != 'Windows'
      # A native call stuck on the port keeps node from exiting, so fail fast instead
      timeout-minutes: 5
      run: npm test
    - if: failure() && runner.os != 'Windows'
      name: Show the loopback's state
      run: |
        cat "$RUNNER_TEMP/pty-loopback.log" || true
        ls -l "$RUNNER_TEMP/ttyLOOP" || true
        ps -eo pid,stat,args | grep -E 'pty-loopback|node' | grep -v grep || true
    - if: runner.os == 'Windows'
      timeout-minutes: 5
      # OpenCppCoverage can't start npm.cmd, so it runs npm's own entry point with node
      run: |
        $npmCli = Join-Path (Split-Path (Get-Command node).Source) 'node_modules\npm\bin\npm-cli.js'
        OpenCppCoverage.exe --quiet --cover_children `
          --modules bindings.node `
          --sources "${{ github.workspace }}\src" `
          --export_type "cobertura:coverage\cpp-cobertura.xml" `
          -- node $npmCli test
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - if: runner.os != 'Windows'
      name: Convert gcov data to a Cobertura report
      run: >
        gcovr --root . --filter src/ --print-summary
        ${{ runner.os == 'macOS' && '--gcov-executable "xcrun llvm-cov gcov"' || '' }}
        --cobertura coverage/cpp-cobertura.xml
    - uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.config.os }}-node-${{ matrix.node-version }}
        path: coverage/
    - uses: codecov/codecov-action@v7
      with:
        files: ./coverage/lcov.info,./coverage/cpp-cobertura.xml
        disable_search: true
        # The reports above are complete; don't let the uploader run gcov/xcode/coverage.py itself
        plugins: noop
        flags: ${{ runner.os }}
        # OIDC isn't available to pull requests from forks; those upload tokenless instead
        use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
